<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div>
            <h1 class="text-center my-3">listado de productos</h1>
        </div>
            <div>
                    <form class="bg-secondary p-3 rounded w-50 m-auto">
                        <div class="mb-3">
                            <label for="nomPro"class="form-label">Nombre Producto</label>
                            <input type="text" class="form-control" id="nomPro">
                        </div>
                        <div class="mb-3">
                            <label for="precioPro" class="form-label">Precio Producto</label>
                            <input type="number" class="form-control" id="precioPro">
                        </div>
                        <div class="mb-3">
                            <label for="cantidadPro" class="form-label">Cantidad Producto</label>
                            <input type="number" class="form-control" id="cantidadPro">
                        </div>
                        <div class="mb-3">
                            <label for="imagenPro" class="form-label">Imagen Producto</label>
                            <input type="url" class="form-control" id="imagenPro">
                        </div>

                        <button type="button" class="btnGuardar btn btn-primary">Guardar</button>
                        <button type="button" class="d-none btnActualizar btn btn-success">Actualizar</button>
                    </form>
            </div>
            <div class=" p-3 rounded w-50 m-auto">
                <table class="table mt-5">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre Producto</th>
                            <th>Precio Producto</th>
                            <th>Cantidad Producto</th>
                            <th>Imagen Producto</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
